name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: `enablement: true` can only auto-create the Pages site when a token
      # with repository-admin permissions is supplied (e.g. via a PAT/secret).
      # The default GITHUB_TOKEN cannot create the initial Pages site, so Pages
      # must first be enabled once manually: Settings -> Pages -> Build and
      # deployment -> Source: "GitHub Actions".
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp index.html solver.js .nojekyll _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
