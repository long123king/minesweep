<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Minesweeper</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #2a2a3c;
    --panel-light: #3a3a4f;
    --border-light: #5a5a72;
    --border-dark: #14141c;
    --text: #e6e6f0;
    --text-dim: #9090a8;
    --accent: #7aa2f7;
    --hidden: #4a4a62;
    --hidden-hl: #5c5c78;  /* hover/highlight */
    --revealed: #1a1a24;
    --cell-size: 32px;
    --gap: 2px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .game {
    background: var(--panel);
    border: 2px solid var(--border-light);
    border-radius: 6px;
    padding: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--panel-light);
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .display {
    background: #0a0a12;
    color: #ff5555;
    font-family: "Courier New", monospace;
    font-size: 22px;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 3px;
    min-width: 64px;
    text-align: center;
    border: 1px solid var(--border-dark);
    font-variant-numeric: tabular-nums;
  }

  .face {
    width: 40px;
    height: 40px;
    background: var(--hidden);
    border: 2px solid var(--border-light);
    border-bottom-color: var(--border-dark);
    border-right-color: var(--border-dark);
    border-radius: 4px;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.05s;
  }
  .face:active { transform: scale(0.95); }
  .face.worried { background: #c75c5c; }

  .board {
    display: grid;
    gap: var(--gap);
    background: var(--border-dark);
    padding: 4px;
    border-radius: 3px;
    touch-action: manipulation;
    width: max-content;
    justify-self: center;
  }

  .cell {
    width: var(--cell-size);
    height: var(--cell-size);
    background: var(--hidden);
    border: 2px solid var(--border-light);
    border-bottom-color: var(--border-dark);
    border-right-color: var(--border-dark);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.05s;
  }
  .cell:hover:not(.revealed) { background: var(--hidden-hl); }
  .cell.pressed { background: var(--revealed); }
  .cell.revealed {
    background: var(--revealed);
    border: 1px solid var(--border-dark);
  }
  .cell.revealed.mine {
    background: #c75c5c;
    color: #000;
  }
  .cell.flagged::before { content: "⚑"; color: #ff5555; }
  .cell.mine::before { content: "✸"; color: #000; }
  .cell.wrong-flag::before { content: "✗"; color: #ff5555; }

  /* Insight heat overlay — sits inside each unrevealed/unflagged cell.
     Empty div with background-color only; toggled via .insight-on on .board. */
  .cell .overlay {
    display: none;
    position: absolute;
    inset: 0;
    border-radius: 2px;
    pointer-events: none;
  }
  .cell {
    position: relative; /* anchor for .overlay */
  }
  .board.insight-on .cell:not(.revealed):not(.flagged) .overlay {
    display: block;
  }
  .board.insight-on .cell.flagged .overlay {
    /* When flagged, show a faint neutral overlay so user can still see the flag.
       Use a low-saturation gray that doesn't fight the red flag glyph. */
    display: block;
    background: rgba(255, 255, 255, 0.05);
  }

  /* Hover analysis — outlines on cells that contributed to the subject's
     probability. Driven by .board.analysis-active on the board element
     (single class, no per-cell state needed). */
  .board.analysis-active .cell.hover-subject {
    outline: 2px solid #ffd866;            /* gold = "you are here" */
    outline-offset: -2px;
    z-index: 3;
  }
  .board.analysis-active .cell.hover-co {
    outline: 2px solid #5fd7d7;            /* cyan = sibling unknown */
    outline-offset: -2px;
    z-index: 2;
  }
  .board.analysis-active .cell.hover-constraint {
    outline: 2px dashed #f7a05f;           /* orange dashed = constraint number */
    outline-offset: -2px;
    z-index: 2;
  }
  .board.analysis-active .cell.hover-flag {
    outline: 2px dotted #ff5555;           /* red dotted = contributing flag */
    outline-offset: -2px;
    z-index: 2;
  }

  /* Analysis panel — absolutely positioned beside the board. It lives
     outside .game's layout flow entirely, so the board's position
     and size stay exactly the same whether the panel is empty, in
     placeholder mode, or showing live math. Anchored to .board-wrap
     (which is position:relative). */
  .board-wrap {
    position: relative;       /* anchor for absolute child */
    flex: 0 0 auto;
    width: max-content;
  }
  .analysis-panel {
    position: absolute;
    top: 0;
    left: 100%;
    margin-left: 12px;
    width: 280px;
    /* Match the tallest possible board (16 rows × 32px + border/padding).
       Any taller content scrolls inside the panel. */
    max-height: calc(var(--cell-size) * 16 + 24px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border-light);
    border-radius: 4px;
    padding: 12px 14px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    box-sizing: border-box;
    z-index: 10;
  }
  .analysis-panel .ap-empty {
    color: var(--text-dim);
    text-align: center;
    padding: 20px 4px;
  }
  .analysis-panel .ap-empty-title {
    font-size: 14px;
    font-weight: bold;
    color: var(--text);
    margin-bottom: 4px;
  }
  .analysis-panel .ap-empty-body {
    font-size: 11px;
    line-height: 1.4;
  }
  /* Simplified analysis layout — hero number + plain-English reason. */
  .analysis-panel .ap-hero {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border-dark);
  }
  .analysis-panel .ap-cell {
    font-size: 12px;
    color: var(--text-dim);
    font-family: "Courier New", monospace;
  }
  .analysis-panel .ap-pct {
    font-family: "Courier New", monospace;
    font-size: 28px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 4px;
    background: #0a0a12;
    margin-left: auto;
  }
  .analysis-panel .ap-reason {
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);
  }
  /* Step-by-step calculation block — shows how the probability was
     computed (enumeration sizes, filter counts, the final formula). */
  .analysis-panel .ap-calc {
    margin-top: 10px;
    padding: 8px 10px;
    background: rgba(10, 10, 18, 0.55);
    border: 1px solid var(--border-dark);
    border-radius: 4px;
    font-size: 11px;
    line-height: 1.55;
  }
  .analysis-panel .ap-calc-title {
    font-size: 10px;
    font-weight: bold;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px dashed var(--border-dark);
  }
  .analysis-panel .ap-calc-step {
    color: var(--text);
    margin: 3px 0;
    line-height: 1.5;
  }
  .analysis-panel .ap-calc-step b {
    color: var(--accent);
    font-weight: bold;
  }
  .analysis-panel .ap-calc-step code {
    background: rgba(0,0,0,0.4);
    padding: 1px 4px;
    border-radius: 2px;
    font-size: 10px;
    font-family: "Courier New", monospace;
  }
  .analysis-panel .ap-calc-formula {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed var(--border-dark);
    font-family: "Courier New", monospace;
    font-size: 12px;
    color: var(--text);
    font-weight: bold;
  }
  .analysis-panel .ap-calc-formula b {
    color: var(--accent);
    font-size: 13px;
  }
  .analysis-panel .ap-stats {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border-dark);
    font-size: 11px;
    color: var(--text-dim);
  }
  .analysis-panel .ap-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border-dark);
    font-size: 10px;
    color: var(--text-dim);
  }
  .analysis-panel .ap-legend span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .analysis-panel .ap-legend i {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    border: 1px solid currentColor;
  }

  /* On narrow viewports, drop the panel below the board instead of
     beside it. Still absolutely positioned so it doesn't affect the
     board's layout. */
  @media (max-width: 720px) {
    .analysis-panel {
      top: 100%;
      left: 0;
      margin-top: 12px;
      margin-left: 0;
      width: calc(var(--cell-size) * 9 + 12px);
      max-width: 100%;
      max-height: 220px;
    }
  }

  .n1 { color: #5fb3f7; }
  .n2 { color: #7ec97e; }
  .n3 { color: #f76c5f; }
  .n4 { color: #b78ef7; }
  .n5 { color: #f7a05f; }
  .n6 { color: #5fd7d7; }
  .n7 { color: #e6e6e6; }
  .n8 { color: #9090a8; }

  .footer {
    margin-top: 12px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #tools.footer { margin-top: 6px; }
  #insightBtn.active {
    background: linear-gradient(90deg, #5fb3f7, #7ec97e, #f7a05f, #f76c5f);
    color: #0a0a12;
    border-color: transparent;
    font-weight: bold;
  }

  .btn {
    background: var(--panel-light);
    color: var(--text);
    border: 2px solid var(--border-light);
    border-bottom-color: var(--border-dark);
    border-right-color: var(--border-dark);
    border-radius: 3px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:active {
    border-bottom-color: var(--border-light);
    border-right-color: var(--border-light);
    border-top-color: var(--border-dark);
    border-left-color: var(--border-dark);
  }
  .btn.active {
    background: var(--accent);
    color: #0a0a12;
    border-color: var(--accent);
  }

  .help {
    margin-top: 10px;
    color: var(--text-dim);
    font-size: 11px;
    text-align: center;
    line-height: 1.5;
    max-width: 480px;
  }

  /* small screens */
  @media (max-width: 600px) {
    :root { --cell-size: 26px; --gap: 1px; }
    .display { font-size: 18px; min-width: 56px; }
    .game { padding: 8px; }
  }
  @media (max-width: 420px) {
    :root { --cell-size: 22px; }
    .cell { font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="game" id="game">
    <div class="header">
      <div class="display" id="mineCounter">000</div>
      <button class="face" id="face" title="New game">🙂</button>
      <div class="display" id="timer">000</div>
    </div>
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <!-- Analysis panel — absolutely positioned beside the board. It is
           NOT in the document flow that sizes .game, so the board's
           position and size stay exactly the same whether the panel is
           empty, showing placeholder, or showing live math. Anchored to
           .board-wrap (which is position:relative). -->
      <aside class="analysis-panel" id="analysis" aria-live="polite">
        <div class="ap-empty">
          <div class="ap-empty-title">Hover a cell</div>
          <div class="ap-empty-body">to see its mine probability</div>
        </div>
      </aside>
    </div>
    <div class="footer" id="difficulty"></div>
    <div class="footer" id="tools">
      <button class="btn" id="insightBtn" aria-pressed="false">Insight: OFF</button>
      <button class="btn" id="copyLayoutBtn" title="Copy board state and current probability for every cell">Copy Layout</button>
    </div>
    <div class="help">
      Left-click: reveal · Right-click / long-press: flag · Click number: chord reveal · Insight: heat-map unrevealed cells by mine probability · Hover a cell: see how its probability was calculated
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ---------- Config ----------
  const DIFFICULTIES = {
    beginner:     { rows: 9,  cols: 9,  mines: 10 },
    intermediate: { rows: 16, cols: 16, mines: 40 },
    expert:       { rows: 16, cols: 30, mines: 99 },
  };
  let currentDifficulty = "beginner";

  // ---------- State ----------
  let rows, cols, mineCount;
  let board, revealed, flagged, adjacent;
  let firstClick, gameOver, won;
  let flagsPlaced, cellsRevealed;
  let startTime, timerInterval;
  let boardEl, mineCounterEl, timerEl, faceEl, insightBtnEl, copyLayoutBtnEl;
  let showInsight = false;          // user toggle
  let pMineCache = null;             // Float32Array(rows*cols), P(cell is a mine) in [0,1]
  let pMineDirty = true;             // when true, recompute on next paint

  // ---------- Utilities ----------
  const inBounds = (r, c) => r >= 0 && r < rows && c >= 0 && c < cols;
  const pad3 = n => String(Math.max(-99, Math.min(999, n))).padStart(3, "0");

  function setFace(state) {
    // state: idle | worried | win | lose
    faceEl.classList.toggle("worried", state === "lose");
    faceEl.textContent =
      state === "lose" ? "😵" :
      state === "win"  ? "😎" :
      state === "worried" ? "😮" : "🙂";
  }

  function updateMineCounter() {
    mineCounterEl.textContent = pad3(mineCount - flagsPlaced);
  }

  function startTimer() {
    stopTimer();
    startTime = Date.now();
    timerEl.textContent = "000";
    timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      timerEl.textContent = pad3(Math.min(999, elapsed));
    }, 1000);
  }
  function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
  }

  // ---------- Board setup ----------
  function newGame(difficultyKey = currentDifficulty) {
    currentDifficulty = difficultyKey;
    const cfg = DIFFICULTIES[difficultyKey];
    rows = cfg.rows;
    cols = cfg.cols;
    mineCount = cfg.mines;

    board      = Array.from({ length: rows }, () => Array(cols).fill(0));
    revealed   = Array.from({ length: rows }, () => Array(cols).fill(false));
    flagged    = Array.from({ length: rows }, () => Array(cols).fill(false));
    adjacent   = Array.from({ length: rows }, () => Array(cols).fill(0));
    firstClick = true;
    gameOver   = false;
    won        = false;
    flagsPlaced = 0;
    cellsRevealed = 0;

    stopTimer();
    timerEl.textContent = "000";
    updateMineCounter();
    setFace("idle");

    renderBoard();
    highlightActiveDifficulty();
    invalidateInsight();
  }

  function placeMines(safeR, safeC) {
    // Build a list of all cell coords minus the safe zone (the clicked cell
    // and its immediate neighbours).
    const candidates = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
        candidates.push([r, c]);
      }
    }
    // Fisher–Yates shuffle, then take the first mineCount.
    for (let i = candidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    const placed = candidates.slice(0, mineCount);
    for (const [r, c] of placed) {
      board[r][c] = 1; // 1 = mine
    }
    // Compute adjacency counts.
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (board[r][c] === 1) continue;
        let n = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (inBounds(nr, nc) && board[nr][nc] === 1) n++;
          }
        }
        adjacent[r][c] = n;
      }
    }
  }

  // ---------- Reveal logic ----------
  function floodReveal(r, c) {
    // Iterative BFS reveal for zero-adjacent cells. Pure stack-based to
    // avoid recursion depth issues on large boards.
    const stack = [[r, c]];
    while (stack.length) {
      const [cr, cc] = stack.pop();
      if (!inBounds(cr, cc) || revealed[cr][cc] || flagged[cr][cc]) continue;
      revealed[cr][cc] = true;
      cellsRevealed++;
      if (adjacent[cr][cc] === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            stack.push([cr + dr, cc + dc]);
          }
        }
      }
    }
  }

  function reveal(r, c) {
    if (gameOver) return;
    if (!inBounds(r, c) || revealed[r][c] || flagged[r][c]) return;

    if (firstClick) {
      firstClick = false;
      placeMines(r, c);
      startTimer();
    }

    if (board[r][c] === 1) {
      // BOOM — but only if this wasn't the synthetic chord reveal that
      // already short-circuited on flagged-neighbour count. Land the mine
      // click on the original cell.
      loseGame(r, c);
      return;
    }

    floodReveal(r, c);
    renderCells();

    if (cellsRevealed === rows * cols - mineCount) {
      winGame();
    } else {
      invalidateInsight();
    }
  }

  function chordReveal(r, c) {
    // Classic Minesweeper: clicking a revealed numbered cell reveals all
    // un-flagged neighbours — but only if the number of flagged neighbours
    // exactly equals the cell's adjacency count.
    if (gameOver || !revealed[r][c] || adjacent[r][c] === 0) return;
    let flagCount = 0;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc) && flagged[nr][nc]) flagCount++;
      }
    }
    if (flagCount !== adjacent[r][c]) return;

    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc) && !flagged[nr][nc]) {
          if (board[nr][nc] === 1) {
            loseGame(nr, nc);
            return;
          }
          if (!revealed[nr][nc]) floodReveal(nr, nc);
        }
      }
    }
    renderCells();
    if (cellsRevealed === rows * cols - mineCount) {
      winGame();
    } else {
      invalidateInsight();
    }
  }

  function toggleFlag(r, c) {
    if (gameOver) return;
    if (!inBounds(r, c) || revealed[r][c]) return;
    flagged[r][c] = !flagged[r][c];
    flagsPlaced += flagged[r][c] ? 1 : -1;
    updateMineCounter();
    renderCell(r, c);
    invalidateInsight();
  }

  // ---------- Win / Lose ----------
  function loseGame(mineR, mineC) {
    gameOver = true;
    won = false;
    stopTimer();
    // Reveal all mines; mark wrong flags.
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (board[r][c] === 1) revealed[r][c] = true;
        if (board[r][c] !== 1 && flagged[r][c]) flagged[r][c] = true; // keep
      }
    }
    setFace("lose");
    renderCells();
    invalidateInsight();   // surfaces ground-truth mines as hot
    // Highlight the mine that killed the player.
    const cellEl = boardEl.children[mineR * cols + mineC];
    if (cellEl) {
      cellEl.classList.add("mine");
      cellEl.style.background = "#ff3333";
    }
  }

  function winGame() {
    gameOver = true;
    won = true;
    stopTimer();
    // Auto-flag remaining mines.
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (board[r][c] === 1 && !flagged[r][c]) {
          flagged[r][c] = true;
          flagsPlaced++;
        }
      }
    }
    updateMineCounter();
    setFace("win");
    renderCells();
    invalidateInsight();   // clears all unrevealed overlays (board is solved)
  }

  // ---------- Rendering ----------
  function renderBoard() {
    boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
    boardEl.style.gridTemplateRows    = `repeat(${rows}, var(--cell-size))`;
    boardEl.innerHTML = "";
    const frag = document.createDocumentFragment();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement("button");
        cell.className = "cell";
        cell.dataset.r = r;
        cell.dataset.c = c;
        cell.setAttribute("aria-label", `row ${r + 1} column ${c + 1}`);
        // Overlay div is created once per cell and reused on repaint.
        // The `.board.insight-on` class drives visibility via CSS so
        // toggling the overlay does not require touching each cell.
        const overlay = document.createElement("div");
        overlay.className = "overlay";
        cell.appendChild(overlay);
        frag.appendChild(cell);
      }
    }
    boardEl.appendChild(frag);
    renderCells();
  }

  function renderCell(r, c) {
    const el = boardEl.children[r * cols + c];
    if (!el) return;
    el.className = "cell";
    // Preserve the overlay div (created once in renderBoard) so we don't
    // need to recreate 81+ divs on every paint. Wipe text content only.
    el.childNodes.forEach(n => {
      if (n.nodeType === Node.TEXT_NODE) n.remove();
    });
    el.style.background = "";
    if (flagged[r][c]) {
      el.classList.add("flagged");
      if (gameOver && board[r][c] !== 1) el.classList.add("wrong-flag");
      return;
    }
    if (!revealed[r][c]) return;
    el.classList.add("revealed");
    if (board[r][c] === 1) {
      el.classList.add("mine");
    } else if (adjacent[r][c] > 0) {
      el.appendChild(document.createTextNode(adjacent[r][c]));
      el.classList.add(`n${adjacent[r][c]}`);
    }
  }

  function renderCells() {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        renderCell(r, c);
      }
    }
  }

  // ---------- Insight solver ----------
  // Build a per-cell probability of being a mine. Strategy:
  //   1. Find frontier — revealed numbered cells whose 8-neighborhood
  //      contains at least one unrevealed+unflagged cell.
  //   2. Group frontier cells into connected components via BFS over
  //      shared unrevealed neighbors. Each component is a small linear
  //      system of equations over the unrevealed cells it touches.
  //   3. For each component, enumerate all valid mine placements
  //      (capped — see MAX_CONFIGS). For every unrevealed cell in the
  //      component, accumulate (configCount, configsWithMine) — these
  //      are weighted per component when combining overlapping cells.
  //   4. Cells not in any frontier component use the global rate:
  //      remainingMines / remainingUnrevealedCells (capped to [0,1]).
  // This is the standard local-constraint solver used by Minesweeper
  // assistants. Subset-decomposition across components (a cell can sit
  // in two) gives the weighted combination automatically.
  //
  // Side-effect: also populates `analysisCache` — a Map keyed by
  // unrevealed-cell index → list of component records that contributed
  // to that cell's probability. Each record carries the constraint
  // equations, vars, total configs, and configs where the cell was a
  // mine. Used by the hover-analysis panel.
  const MAX_CONFIGS = 1 << 20;     // hard cap on enumerations per component
  const MAX_VARS    = 22;          // if a component touches more vars, skip it
  let analysisCache = new Map();   // cellIdx -> [{componentId, ...}, ...]
  let analysisCacheGlobalRate = 0; // populated alongside pMineCache

  function computeProbabilities() {
    const N = rows * cols;
    const out = new Float32Array(N);   // pMine per cell, default 0
    const weight = new Float32Array(N); // total weight (config counts) per cell
    analysisCache = new Map();         // reset per solve

    if (gameOver) {
      // After win/lose the answer is known exactly; surface it so the
      // overlay reflects ground truth instead of stale probability.
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = r * cols + c;
          if (board[r][c] === 1) { out[idx] = 1; weight[idx] = 1; }
        }
      }
      // For ground truth every cell is "determined" — fabricate an
      // analysis record so the hover panel can say MINE / SAFE.
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = r * cols + c;
          if (revealed[r][c]) continue;
          analysisCache.set(idx, [{
            componentId: -1,
            groundTruth: true,
            isMine: board[r][c] === 1,
          }]);
        }
      }
      pMineCache = out;
      return out;
    }

    // Index helper.
    const idxOf = (r, c) => r * cols + c;
    const idxRC = idx => [Math.floor(idx / cols), idx % cols];

    // 1. Build frontier list: revealed-numbered cells that border at
    //    least one unrevealed+unflagged cell.
    const isFrontier = new Uint8Array(N);
    const frontierId = new Int32Array(N); // -1 = not frontier
    frontierId.fill(-1);
    const frontierCells = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (!revealed[r][c] || adjacent[r][c] === 0) continue;
        let hasUnknown = false;
        for (let dr = -1; dr <= 1 && !hasUnknown; dr++) {
          for (let dc = -1; dc <= 1 && !hasUnknown; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (inBounds(nr, nc) && !revealed[nr][nc] && !flagged[nr][nc]) {
              hasUnknown = true;
            }
          }
        }
        if (hasUnknown) {
          isFrontier[idxOf(r, c)] = 1;
          frontierId[idxOf(r, c)] = frontierCells.length;
          frontierCells.push(idxOf(r, c));
        }
      }
    }

    // 2. Connected components over the bipartite frontier<->unknown graph.
    //    Two frontiers belong to the same component if they share ANY
    //    unknown cell (via BFS through unknowns). Previously we only
    //    linked adjacent frontier cells, which missed cases like two
    //    non-adjacent '1's sharing an unknown in their neighborhoods —
    //    this caused severely wrong probabilities on cells in the
    //    intersection. BFS through the bipartite graph fixes it.
    const fToU = new Map(); // frontierIdx -> Set<unknownIdx>
    const uToF = new Map(); // unknownIdx -> Set<frontierIdx>
    for (const fIdx of frontierCells) {
      fToU.set(fIdx, new Set());
      const [fr, fc] = idxRC(fIdx);
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = fr + dr, nc = fc + dc;
          if (!inBounds(nr, nc)) continue;
          const nIdx = idxOf(nr, nc);
          if (!revealed[nr][nc] && !flagged[nr][nc]) {
            fToU.get(fIdx).add(nIdx);
            if (!uToF.has(nIdx)) uToF.set(nIdx, new Set());
            uToF.get(nIdx).add(fIdx);
          }
        }
      }
    }
    const compIdF = new Int32Array(N).fill(-1); // frontier idx -> cid
    const compIdU = new Int32Array(N).fill(-1); // unknown  idx -> cid
    const components = [];
    for (const fIdx of frontierCells) {
      if (compIdF[fIdx] !== -1) continue;
      const cid = components.length;
      const fset = [];
      const uset = [];
      const stack = [fIdx];
      compIdF[fIdx] = cid;
      fset.push(fIdx);
      while (stack.length) {
        const cur = stack.pop();
        // cur is a frontier. Expand through its unknowns to other frontiers.
        const us = fToU.get(cur);
        if (!us) continue;
        for (const uIdx of us) {
          if (compIdU[uIdx] === -1) {
            compIdU[uIdx] = cid;
            uset.push(uIdx);
          }
          const fset2 = uToF.get(uIdx);
          if (!fset2) continue;
          for (const f2 of fset2) {
            if (compIdF[f2] === -1) {
              compIdF[f2] = cid;
              fset.push(f2);
              stack.push(f2);
            }
          }
        }
      }
      components.push({ frontier: fset, unknowns: uset });
    }

    // 3. Enumerate configurations per component.
    for (let ci = 0; ci < components.length; ci++) {
      const comp = components[ci];
      const vars = comp.unknowns;
      const m = vars.length;
      if (m === 0) continue;
      if (m > MAX_VARS) continue; // too big — fall back to global rate

      // For each frontier cell, count (flags + mines among unknowns).
      // The constraint is: flags_in_8nb + mines_in_unknowns = adjacency.
      const constraints = []; // [{ frontierIdx, vars: [indices into vars], need: int, flags: int }]
      for (const fIdx of comp.frontier) {
        const [fr, fc] = idxRC(fIdx);
        let flags = 0;
        const involvedVars = [];
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = fr + dr, nc = fc + dc;
            if (!inBounds(nr, nc)) continue;
            if (flagged[nr][nc]) { flags++; continue; }
            if (!revealed[nr][nc]) {
              const v = vars.indexOf(idxOf(nr, nc));
              if (v !== -1) involvedVars.push(v);
            }
          }
        }
        constraints.push({
          frontierIdx: fIdx,
          vars: involvedVars,
          need: adjacent[fr][fc] - flags,
          flags,
        });
      }

      // Enumerate all 2^m assignments. Filter to those satisfying every
      // constraint. Accumulate per-variable "mine count" and total configs.
      const mineCountArr = new Int32Array(m);
      let totalConfigs = 0;
      const limit = Math.min(1 << m, MAX_CONFIGS);
      for (let bits = 0; bits < limit; bits++) {
        let ok = true;
        for (const con of constraints) {
          let s = 0;
          for (const v of con.vars) if ((bits >> v) & 1) s++;
          if (s !== con.need) { ok = false; break; }
        }
        if (!ok) continue;
        totalConfigs++;
        for (let v = 0; v < m; v++) {
          if ((bits >> v) & 1) mineCountArr[v]++;
        }
      }

      if (totalConfigs === 0) continue;

      // Weight by totalConfigs so a more-informative component dominates
      // for cells that lie in multiple components.
      for (let v = 0; v < m; v++) {
        const cellIdx = vars[v];
        out[cellIdx]     += mineCountArr[v];
        weight[cellIdx]  += totalConfigs;
      }

      // Build analysis records for every unknown in this component. We
      // attach the full constraint list so the hover panel can display
      // the equations without recomputing anything.
      const flaggedInComp = [];
      // Collect flagged cells that participate in this component's
      // constraints (they reduce `need` and are part of the calculation).
      for (const con of constraints) {
        const [fr, fc] = idxRC(con.frontierIdx);
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = fr + dr, nc = fc + dc;
            if (inBounds(nr, nc) && flagged[nr][nc]) {
              flaggedInComp.push(idxOf(nr, nc));
            }
          }
        }
      }
      const uniqueFlagged = Array.from(new Set(flaggedInComp));

      const componentRecord = {
        componentId: ci,
        frontier: comp.frontier.slice(),   // constraint cell indices
        unknowns: vars.slice(),            // unknown cell indices (includes subject)
        flagged: uniqueFlagged,
        constraints: constraints.map(con => ({
          frontierIdx: con.frontierIdx,
          vars: con.vars.slice(),
          need: con.need,
          flags: con.flags,
        })),
        totalConfigs,
        capped: limit < (1 << m),
        m,
      };

      for (let v = 0; v < m; v++) {
        const cellIdx = vars[v];
        if (!analysisCache.has(cellIdx)) analysisCache.set(cellIdx, []);
        const arr = analysisCache.get(cellIdx);
        arr.push({
          ...componentRecord,
          subjectVarIdx: v,
          configsWithMine: mineCountArr[v],
        });
      }
    }

    // 4. Combine + global-rate fallback for cells outside any frontier.
    let remainingMines = mineCount - flagsPlaced;
    let unrevealedTotal = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (!revealed[r][c] && !flagged[r][c]) unrevealedTotal++;
      }
    }
    const globalRate = unrevealedTotal > 0
      ? Math.max(0, Math.min(1, remainingMines / unrevealedTotal))
      : 0;
    analysisCacheGlobalRate = globalRate;

    // Brute-force path: if the total unrevealed-unflagged count is small
    // enough, enumerate ALL consistent mine placements (filtering by
    // EVERY revealed-numbered cell's adjacency, including non-frontier
    // ones) AND the global mine-count constraint (total mines - flags =
    // remainingMines). This is exact — it gives the true posterior
    // P(mine) per cell, including the global coupling that component
    // enumeration ignores. Cost is O(2^F * R) where F = freeCells,
    // R = revealed constraints. Capped at MAX_BRUTE_FORCE_VARS so the
    // browser stays responsive; for larger boards we fall back to the
    // local-component approximation below.
    const MAX_BRUTE_FORCE_VARS = 22;
    const freeCells = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (!revealed[r][c] && !flagged[r][c]) freeCells.push(idxOf(r, c));
      }
    }
    let usedBruteForce = false;
    if (freeCells.length > 0 && freeCells.length <= MAX_BRUTE_FORCE_VARS) {
      // Build all constraints (every revealed cell with adj > 0).
      const allConstraints = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!revealed[r][c] || adjacent[r][c] === 0) continue;
          let flags = 0;
          const involved = [];
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr, nc = c + dc;
              if (!inBounds(nr, nc)) continue;
              if (flagged[nr][nc]) { flags++; continue; }
              if (!revealed[nr][nc]) involved.push(idxOf(nr, nc));
            }
          }
          allConstraints.push({ involved, need: adjacent[r][c] - flags });
        }
      }
      // Map freeCell idx -> bit position.
      const bitOf = new Map();
      for (let i = 0; i < freeCells.length; i++) bitOf.set(freeCells[i], i);
      // Translate involved-cell-idxs into bit positions (drop ones not free).
      const bfConstraints = allConstraints.map(con => {
        const bits = [];
        for (const ci of con.involved) {
          const b = bitOf.get(ci);
          if (b !== undefined) bits.push(b);
        }
        return { bits, need: con.need };
      });
      const F = freeCells.length;
      const limit = 1 << F;
      const bfMineCount = new Int32Array(F);
      let bfTotal = 0;
      for (let bits = 0; bits < limit; bits++) {
        // Mine count check: popcount must equal remainingMines.
        let pop = 0;
        for (let b = 0; b < F; b++) if ((bits >> b) & 1) pop++;
        if (pop !== remainingMines) continue;
        // Check every constraint.
        let ok = true;
        for (const con of bfConstraints) {
          let s = 0;
          for (const b of con.bits) if ((bits >> b) & 1) s++;
          if (s !== con.need) { ok = false; break; }
        }
        if (!ok) continue;
        bfTotal++;
        for (let b = 0; b < F; b++) if ((bits >> b) & 1) bfMineCount[b]++;
      }
      if (bfTotal > 0) {
        // Override local-component results with brute-force truth.
        for (let i = 0; i < N; i++) {
          out[i] = 0;
          weight[i] = 0;
        }
        for (let b = 0; b < F; b++) {
          const cellIdx = freeCells[b];
          out[cellIdx] = bfMineCount[b] / bfTotal;
          weight[cellIdx] = 1;
        }
        // Tag every free cell's analysis record so the panel can mention
        // the brute-force source. Keep the existing per-component records
        // for showing constraint equations — but the displayed number is
        // the brute-force answer.
        for (let b = 0; b < F; b++) {
          const cellIdx = freeCells[b];
          if (!analysisCache.has(cellIdx)) analysisCache.set(cellIdx, []);
          analysisCache.get(cellIdx).push({
            componentId: -3,
            bruteForce: true,
            bfTotal,
            bfMineCount: bfMineCount[b],
            globalRate,
            remainingMines,
            unrevealedTotal,
          });
        }
        usedBruteForce = true;
      }
    }

    if (!usedBruteForce) {
      // Fallback path: combine component-local enumeration results with a
      // GLOBAL-mine-count correction. The component solver alone ignores
      // the global constraint (total mines left in the whole board), so
      // far cells get a wildly wrong "remaining/unrevealed" rate and
      // in-component cells can be biased too. Correcting this matters
      // most on Intermediate/Expert where brute force never fits.
      //
      // Step 1: convert component counts into local probabilities, then sum
      // the expected mines. Keep logical deductions exact: a cell that is
      // a mine in every valid local placement is forced to 100%, and one
      // that appears in none is forced to 0%. Global renormalization must
      // never weaken those hard constraints.
      const localProbability = new Float32Array(N);
      let forcedMineCount = 0;
      let adjustableExpectedMines = 0;
      let inComponentCellCount = 0;
      for (let i = 0; i < N; i++) {
        const rr = Math.floor(i / cols), cc = i % cols;
        if (revealed[rr][cc] || flagged[rr][cc] || weight[i] <= 0) continue;
        const localP = Math.max(0, Math.min(1, out[i] / weight[i]));
        localProbability[i] = localP;
        inComponentCellCount++;
        if (localP === 1) forcedMineCount++;
        else if (localP > 0) adjustableExpectedMines += localP;
      }
      const inComponentExpectedMines = forcedMineCount + adjustableExpectedMines;

      // Far cells: unrevealed-unflagged AND not in any component.
      const farCellCount = unrevealedTotal - inComponentCellCount;
      const budgetAfterForced = Math.max(0, remainingMines - forcedMineCount);

      // Scale only uncertain component cells if their expectation plus the
      // forced mines exceeds the global budget. Forced 0/1 cells stay exact.
      let scaleFactor = 1.0;
      if (adjustableExpectedMines > budgetAfterForced && adjustableExpectedMines > 0) {
        scaleFactor = budgetAfterForced / adjustableExpectedMines;
      }
      const scaledAdjustableExpectedMines = adjustableExpectedMines * scaleFactor;
      const farCellExpectedMines = Math.max(0, budgetAfterForced - scaledAdjustableExpectedMines);
      const farRate = farCellCount > 0 ? Math.min(1, farCellExpectedMines / farCellCount) : 0;

      // Step 2: write final probabilities.
      for (let i = 0; i < N; i++) {
        const r = Math.floor(i / cols), c = i % cols;
        if (revealed[r][c] || flagged[r][c]) continue;
        if (weight[i] > 0) {
          const localP = localProbability[i];
          out[i] = (localP === 0 || localP === 1)
            ? localP
            : Math.max(0, Math.min(1, localP * scaleFactor));
        } else {
          // Far cell — adjusted rate based on remaining mines after
          // component contributions are accounted for.
          out[i] = farRate;
          if (!analysisCache.has(i)) analysisCache.set(i, []);
          analysisCache.get(i).push({
            componentId: -2,
            globalRate: true,
            remainingMines,
            unrevealedTotal,
            inComponentExpectedMines,
            inComponentCellCount,
            forcedMineCount,
            adjustableExpectedMines,
            farCellCount,
            farCellExpectedMines,
            scaleFactor,
          });
        }
      }
    }

    // Revealed non-mine cells get pMine=0 for completeness.
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (revealed[r][c] && board[r][c] !== 1) {
          out[idxOf(r, c)] = 0;
        }
      }
    }

    pMineCache = out;
    return out;
  }

  // Map a probability in [0,1] to a hot↔cool CSS color.
  // 0.00 → deep cool blue (#2a5fb7)
  // 0.50 → neutral dark (#3a3a4f, lets the cell face show through)
  // 1.00 → deep hot red (#b73a3a)
  // We use a piecewise gradient with three stops so the cool half and
  // hot half read distinctly, and 0.5 stays muted to avoid confusion
  // with revealed numbers.
  function probToColor(p) {
    const cp = Math.max(0, Math.min(1, p));
    // Three stops: cool(0.0) → neutral(0.5) → hot(1.0).
    const stops = [
      { t: 0.0, r: 42,  g: 95,  b: 183 }, // #2a5fb7 cool
      { t: 0.5, r: 58,  g: 58,  b: 79  }, // #3a3a4f neutral
      { t: 1.0, r: 183, g: 58,  b: 58  }, // #b73a3a hot
    ];
    let lo = stops[0], hi = stops[stops.length - 1];
    for (let i = 0; i < stops.length - 1; i++) {
      if (cp >= stops[i].t && cp <= stops[i + 1].t) {
        lo = stops[i]; hi = stops[i + 1]; break;
      }
    }
    const span = hi.t - lo.t || 1;
    const f = (cp - lo.t) / span;
    const r = Math.round(lo.r + (hi.r - lo.r) * f);
    const g = Math.round(lo.g + (hi.g - lo.g) * f);
    const b = Math.round(lo.b + (hi.b - lo.b) * f);
    return `rgb(${r}, ${g}, ${b})`;
  }

  function paintInsight() {
    if (!showInsight) return;
    if (!pMineCache || pMineDirty) {
      computeProbabilities();
      pMineDirty = false;
    }
    const p = pMineCache;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cellEl = boardEl.children[r * cols + c];
        if (!cellEl) continue;
        const overlay = cellEl.querySelector(".overlay");
        if (!overlay) continue;
        if (revealed[r][c] || flagged[r][c]) {
          // CSS handles flagged dim overlay; revealed get nothing.
          overlay.style.background = "";
          continue;
        }
        overlay.style.background = probToColor(p[r * cols + c]);
      }
    }
  }

  function clearInsight() {
    for (const cellEl of boardEl.children) {
      const overlay = cellEl.querySelector(".overlay");
      if (overlay) overlay.style.background = "";
    }
  }

  function setInsight(on) {
    showInsight = !!on;
    boardEl.classList.toggle("insight-on", showInsight);
    insightBtnEl.classList.toggle("active", showInsight);
    insightBtnEl.textContent = showInsight ? "Insight: ON" : "Insight: OFF";
    insightBtnEl.setAttribute("aria-pressed", showInsight ? "true" : "false");
    if (showInsight) {
      pMineDirty = true;
      paintInsight();
    } else {
      clearInsight();
    }
  }

  // Mark insight cache stale on any state change while the toggle is on.
  function invalidateInsight() {
    pMineDirty = true;
    if (showInsight) paintInsight();
    // Analysis is keyed off the same solver state — any change invalidates
    // the cached per-cell records. Clear the live panel so the user
    // doesn't see stale numbers/highlights over a freshly-touched board.
    clearAnalysis();
  }

  // ---------- Hover analysis ----------
  // On pointermove over a cell, show a panel that explains how its
  // P(mine) was computed and outline the contributing cells. Works
  // whether or not Insight is ON — analysis is a separate UX layer
  // powered by the same solver cache.
  //
  // State machine: only one analysis is "live" at a time. We track the
  // subject cell index so redundant pointermoves inside the same cell
  // don't trigger work, and we cleanly clear all DOM marks on
  // pointerleave / state change.
  let analysisEl = null;          // the floating panel
  let analysisSubjectIdx = -1;    // cell index currently being analyzed
  let analysisActive = false;     // whether marks are currently painted

  function ensureSolverFresh() {
    if (!pMineCache || pMineDirty) {
      computeProbabilities();
      pMineDirty = false;
    }
  }

  // Produce a portable debugging snapshot. Every cell includes both its
  // visible state and the solver's current probability, even when Insight
  // is OFF. JSON keeps the copied layout unambiguous and easy to paste into
  // bug reports or parse in a test script.
  function buildLayoutSnapshot() {
    ensureSolverFresh();
    const cells = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        const state = flagged[r][c]
          ? "flagged"
          : revealed[r][c]
            ? "revealed"
            : "hidden";
        cells.push({
          row: r + 1,
          col: c + 1,
          state,
          number: revealed[r][c] && board[r][c] !== 1 ? adjacent[r][c] : null,
          probability: Number(pMineCache[idx].toFixed(6)),
        });
      }
    }
    return JSON.stringify({
      format: "minesweeper-debug-layout-v1",
      difficulty: currentDifficulty,
      rows,
      cols,
      totalMines: mineCount,
      flagsPlaced,
      gameOver,
      won,
      cells,
    }, null, 2);
  }

  async function copyLayout() {
    const text = buildLayoutSnapshot();
    try {
      await navigator.clipboard.writeText(text);
    } catch (_) {
      // Clipboard API can be unavailable for file:// pages. Keep the same
      // one-click behavior with the traditional selection-based fallback.
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      const copied = document.execCommand("copy");
      area.remove();
      if (!copied) throw new Error("Clipboard copy failed");
    }
    copyLayoutBtnEl.textContent = "Copied!";
    clearTimeout(copyLayoutBtnEl._resetTimer);
    copyLayoutBtnEl._resetTimer = setTimeout(() => {
      copyLayoutBtnEl.textContent = "Copy Layout";
    }, 1200);
  }

  function clearAnalysis() {
    if (!analysisActive) return;
    boardEl.classList.remove("analysis-active");
    for (const cellEl of boardEl.children) {
      cellEl.classList.remove(
        "hover-subject", "hover-co", "hover-constraint", "hover-flag"
      );
    }
    analysisActive = false;
    analysisSubjectIdx = -1;
    // Restore the discoverable placeholder so the dock always reads as
    // intentional, never empty or stale.
    showPlaceholder();
  }

  // Initial placeholder markup — kept as a string constant so we can
  // restore it cheaply when hover ends or state changes invalidate
  // the active analysis.
  const PLACEHOLDER_HTML =
    '<div class="ap-empty">' +
      '<div class="ap-empty-title">Hover a cell</div>' +
      '<div class="ap-empty-body">to see its mine probability</div>' +
    '</div>';

  function showPlaceholder() {
    if (analysisEl) analysisEl.innerHTML = PLACEHOLDER_HTML;
  }

  // Format a cell index as a friendly "(row,col)" label, 1-indexed.
  function idxToLabel(i) {
    const r = Math.floor(i / cols) + 1;
    const c = (i % cols) + 1;
    return `(${r},${c})`;
  }

  // Format a probability as a CSS color matching the heat gradient.
  // 0 → cool blue, 0.5 → neutral, 1 → hot red.
  function pctColor(p) {
    if (p < 0.34) return '#5fb3f7';  // cool
    if (p < 0.67) return '#c8c8d8';  // neutral
    return '#f76c5f';                 // hot
  }

  // Format a small int as "N mines" / "1 mine" / "0 mines".
  function plural(n, singular, plural) {
    return n === 1 ? `1 ${singular}` : `${n} ${plural || singular + 's'}`;
  }

  // Plain-English reasoning generators. One sentence per scenario.
  // We pick the most informative reasoning that fits the data.

  function reasonForced(records, idx) {
    // 100% or 0%: a single constraint forces this cell.
    // Find the smallest, cleanest such constraint and explain it.
    for (const rec of records) {
      for (const con of rec.constraints) {
        if (!con.vars.includes(rec.subjectVarIdx)) continue;
        if (con.vars.length !== 1) continue; // only single-unknown constraints
        if (con.need !== 0 && con.need !== 1) continue;
        const fLabel = idxToLabel(con.frontierIdx);
        const num = con.need + con.flags;
        if (con.need === 1) {
          return `The ${num} at ${fLabel} has no other unrevealed neighbors — its mine count must come from you, so you are a mine.`;
        }
        if (con.need === 0 && con.flags === 0) {
          return `The ${num} at ${fLabel} has its mine count already satisfied by other neighbors — you are safe.`;
        }
        if (con.need === 0 && con.flags > 0) {
          return `The ${num} at ${fLabel} has its ${plural(con.flags, 'flag')} counting toward the total — no mine needed here, you are safe.`;
        }
      }
    }
    return null;
  }

  function reasonPartial(rec) {
    // Partial probability: a constraint bounds this cell.
    const total = rec.totalConfigs;
    const mine = rec.configsWithMine;
    const m = rec.m;
    const k = rec.constraints.length;
    // Find the most relevant constraint (one that involves this cell).
    const myConstraint = rec.constraints.find(con => con.vars.includes(rec.subjectVarIdx));
    if (myConstraint) {
      const fLabel = idxToLabel(myConstraint.frontierIdx);
      const num = myConstraint.need + myConstraint.flags;
      const siblings = myConstraint.vars.length - 1;
      if (mine === 0) {
        return `The ${num} at ${fLabel} touches ${siblings} other unrevealed cells. Across all consistent placements of mines among these cells, none lands on you.`;
      }
      if (mine === total) {
        return `The ${num} at ${fLabel} touches ${siblings} other unrevealed cells. In every consistent placement, a mine lands on you.`;
      }
      return `Of ${total.toLocaleString()} ways to place mines consistent with the surrounding numbers, ${mine.toLocaleString()} put a mine here — and ${siblings} other unrevealed cells share in this calculation.`;
    }
    return `Of ${total.toLocaleString()} consistent mine placements across ${m} unknown cells and ${k} constraint cells, ${mine.toLocaleString()} place a mine here.`;
  }

  function reasonGlobal(globalRec) {
    const m = globalRec.remainingMines;
    const u = globalRec.unrevealedTotal;
    if (u <= 0) return `No nearby number cells touch you. The board is fully revealed.`;
    // New global-rate records carry the post-component-adjusted numbers.
    if (globalRec.inComponentCellCount !== undefined && globalRec.farCellCount !== undefined) {
      const farM = globalRec.farCellExpectedMines;
      const farN = globalRec.farCellCount;
      if (farN <= 0) {
        // Far cells form an empty set — every unrevealed cell is in a component.
        return `No nearby number cells touch you, so this is set entirely by component constraints.`;
      }
      const pct = (farM / farN * 100).toFixed(1);
      const inExp = globalRec.inComponentExpectedMines;
      const inN = globalRec.inComponentCellCount;
      const sf = globalRec.scaleFactor;
      const scaleNote = sf < 1 ? ` (component probabilities scaled by ${(sf * 100).toFixed(0)}% to fit the global mine budget)` : '';
      return `No nearby number cells touch you. Solver components across the board expect ~${inExp.toFixed(1)} mines among ${inN} constrained cells${scaleNote}. That leaves about ${plural(Math.round(farM), 'mine')} for ${plural(farN, 'far unrevealed cell')} — about ${pct}% on average.`;
    }
    // Legacy fallback (no adjustment info).
    const pct = (m / u * 100).toFixed(0);
    return `No nearby number cells touch you, so there's no local information. The remaining board has roughly ${plural(m, 'mine')} among ${u} unrevealed cells — about ${pct}% on average.`;
  }

  function totalConstraintCount(records) {
    let n = 0;
    for (const rec of records) n += rec.constraints.length;
    return n;
  }

  function totalUnknownCount(records) {
    let n = 0;
    for (const rec of records) n += rec.m;
    return n;
  }

  // Build the simple analysis panel content. Returns innerHTML.
  // Layout: hero (cell + percentage), plain-English reason, compact
  // stats, legend.
  function buildAnalysis(r, c) {
      const idx = r * cols + c;
      const records = analysisCache.get(idx) || [];
      const cellLabel = idxToLabel(idx);

      // Case 1: game over → ground truth.
      if (gameOver) {
        const isMine = board[r][c] === 1;
        const pctText = isMine ? 'MINE' : 'SAFE';
        const pctColorVal = isMine ? '#ff5555' : '#5fd7d7';
        const reason = isMine
          ? `Game over — this cell contains a mine.`
          : `Game over — this cell is safe.`;
        const calc = `
          <div class="ap-calc">
            <div class="ap-calc-title">Calculation</div>
            <div class="ap-calc-step">[1] Board is in terminal state — all mines are revealed.</div>
            <div class="ap-calc-step">[2] Cell ${cellLabel} = <b>${isMine ? 'mine' : 'safe'}</b> (known exactly).</div>
          </div>`;
        return `
          <div class="ap-hero">
            <span class="ap-cell">Cell ${cellLabel}</span>
            <span class="ap-pct" style="color:${pctColorVal}">${pctText}</span>
          </div>
          <div class="ap-reason">${reason}</div>
          ${calc}`;
      }

      // Case 2: flagged.
      if (flagged[r][c]) {
        const calc = `
          <div class="ap-calc">
            <div class="ap-calc-title">Calculation</div>
            <div class="ap-calc-step">[1] You placed a flag on this cell.</div>
            <div class="ap-calc-step">[2] Solver treats it as a known mine (reduces <code>need</code> on adjacent constraint cells by 1).</div>
            <div class="ap-calc-step">[3] P(mine) = 100% by your declaration.</div>
          </div>`;
        return `
          <div class="ap-hero">
            <span class="ap-cell">Cell ${cellLabel}</span>
            <span class="ap-pct" style="color:#ff5555">FLAG</span>
          </div>
          <div class="ap-reason">You've marked this as a mine. The solver treats it as one when working out probabilities for other cells.</div>
          ${calc}`;
      }

      // Case 3: revealed.
      if (revealed[r][c]) {
        const adj = adjacent[r][c];
        const reason = adj === 0
          ? `Revealed cell — no adjacent mines. It contributes zero information about neighbors beyond being empty.`
          : `Revealed ${adj} — this cell's number is one of the constraints that determines probabilities for its unrevealed neighbors (highlighted in orange when you hover them).`;
        const calc = adj === 0
          ? `<div class="ap-calc">
              <div class="ap-calc-title">Calculation</div>
              <div class="ap-calc-step">[1] Cell is revealed with adj = 0 (no adjacent mines).</div>
              <div class="ap-calc-step">[2] It is NOT a frontier cell (no unrevealed neighbors need constraints).</div>
            </div>`
          : `<div class="ap-calc">
              <div class="ap-calc-title">Calculation</div>
              <div class="ap-calc-step">[1] Cell is revealed with adj = ${adj}.</div>
              <div class="ap-calc-step">[2] This constraint equation will be used by the solver: <code>adj = sum of mines in its unrevealed neighbors</code>.</div>
            </div>`;
        return `
          <div class="ap-hero">
            <span class="ap-cell">Cell ${cellLabel}</span>
            <span class="ap-pct" style="color:#9090a8">${adj}</span>
          </div>
          <div class="ap-reason">${reason}</div>
          ${calc}`;
      }

      // Case 4: active analysis.
      const p = pMineCache[idx];
      const pct = (p * 100).toFixed(1);
      const pColor = pctColor(p);

      // Brute-force records carry the exact (joint-constraint, global-count)
      // probability. The component records that may also be present are
      // useful for highlighting cells on the board, but the displayed
      // number comes from brute force.
      const bfRec = records.find(rec => rec.bruteForce);
      if (bfRec) {
        const total = bfRec.bfTotal;
        const withMine = bfRec.bfMineCount;
        const remaining = bfRec.remainingMines;
        const totalFree = bfRec.unrevealedTotal;
        const realRecords = records.filter(rec => !rec.globalRate && !rec.bruteForce);
        // Count all revealed numbered cells (the constraints actually
        // applied during brute force). This includes both frontier and
        // non-frontier revealed numbers.
        let totalConstraints = 0;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (revealed[r][c] && adjacent[r][c] > 0) totalConstraints++;
          }
        }
        let reason;
        if (realRecords.length > 0) {
          reason = reasonForced(realRecords, idx);
          if (!reason) reason = realRecords.map(rec => reasonPartial(rec)).join(' ');
        } else {
          reason = `No number cells touch you directly, so this is set by the global mine count: ${plural(remaining, 'mine')} among ${plural(totalFree, 'unrevealed cell')}.`;
        }
        const subsetsTried = 1 << totalFree;
        const calc = `
          <div class="ap-calc">
            <div class="ap-calc-title">Calculation (exhaustive brute force)</div>
            <div class="ap-calc-step">[1] Free cells: <b>${totalFree}</b> unrevealed + <b>${flagsPlaced}</b> flagged. Total mines to place: <b>${remaining}</b>.</div>
            <div class="ap-calc-step">[2] Constraint equations: <b>${totalConstraints}</b> from revealed-numbered cells (every revealed number produces one equation: <code>adj = sum of mines in its unrevealed neighbors</code>). Plus the global mine count of ${remaining}.</div>
            <div class="ap-calc-step">[3] Enumerated <b>${subsetsTried.toLocaleString()}</b> subsets (2<sup>${totalFree}</sup>); each one is a candidate mine placement.</div>
            <div class="ap-calc-step">[4] Filtered by every constraint equation and the global mine count. <b>${total.toLocaleString()}</b> placement${total === 1 ? '' : 's'} survived.</div>
            <div class="ap-calc-step">[5] Your cell is a mine in <b>${withMine.toLocaleString()}</b> of those ${total.toLocaleString()} valid placements.</div>
            <div class="ap-calc-formula">P(mine) = ${withMine.toLocaleString()} / ${total.toLocaleString()} = <b>${pct}%</b></div>
          </div>`;
        const legend = `
          <div class="ap-legend">
            <span><i style="background:#ffd866;color:#ffd866"></i> subject</span>
            <span><i style="background:#5fd7d7;color:#5fd7d7"></i> co-unknown</span>
            <span><i style="background:transparent;color:#f7a05f;border-style:dashed"></i> constraint</span>
            <span><i style="background:transparent;color:#ff5555;border-style:dotted"></i> flag</span>
          </div>`;
        return `
          <div class="ap-hero">
            <span class="ap-cell">Cell ${cellLabel}</span>
            <span class="ap-pct" style="color:${pColor}">${pct}%</span>
          </div>
          <div class="ap-reason">${reason}</div>
          ${calc}
          ${legend}`;
      }

      const realRecords = records.filter(rec => !rec.globalRate);
      const globalRec  = records.find(rec => rec.globalRate);

      let reason;
      if (realRecords.length === 0) {
        reason = reasonGlobal(globalRec);
      } else {
        // Try forced first (0% / 100%); fall back to partial.
        reason = reasonForced(realRecords, idx);
        if (!reason) {
          // Combine reasons from all components, weighted.
          reason = realRecords.map(rec => reasonPartial(rec)).join(' ');
        }
      }

      const totalUnk = totalUnknownCount(realRecords);
      const totalCon = totalConstraintCount(realRecords);

      // Build the step-by-step calculation block.
      let calc;
      if (realRecords.length === 0) {
        // Far cell: global rate only
        const farN = globalRec.farCellCount || 0;
        const farM = globalRec.farCellExpectedMines || 0;
        const inN = globalRec.inComponentCellCount || 0;
        const inE = globalRec.inComponentExpectedMines || 0;
        calc = `
          <div class="ap-calc">
            <div class="ap-calc-title">Calculation (global rate fallback)</div>
            <div class="ap-calc-step">[1] No constraint cells touch this cell — it's outside every solver component.</div>
            <div class="ap-calc-step">[2] Total mines remaining: <b>${globalRec.remainingMines}</b> · Total unrevealed: <b>${globalRec.unrevealedTotal}</b>.</div>
            <div class="ap-calc-step">[3] In-component cells (${inN}) collectively expect <b>~${inE.toFixed(1)}</b> mines from local constraints.</div>
            <div class="ap-calc-step">[4] Remaining for far cells: <b>${globalRec.remainingMines}</b> − <b>${inE.toFixed(1)}</b> = <b>${farM.toFixed(1)}</b> across <b>${farN}</b> far cells.</div>
            <div class="ap-calc-formula">P(mine) = ${farM.toFixed(1)} / ${farN} = <b>${pct}%</b></div>
          </div>`;
      } else {
        // In a component: enumerate configs, count mine-at-cell.
        // Sum total configs across all components the subject is in.
        const subjectCompId = realRecords[0].componentId;
        const subjRec = realRecords.find(r => r.componentId === subjectCompId) || realRecords[0];
        const totalC = subjRec.totalConfigs;
        const mineC = subjRec.configsWithMine;
        const isForced = (mineC === 0 || mineC === totalC);
        const calcSteps = [];
        // Per-component breakdown
        if (realRecords.length === 1) {
          const r = realRecords[0];
          const limitR = Math.min(1 << r.m, 1 << 20);
          const subsets = Math.min(1 << r.m, limitR);
          calcSteps.push(`[1] Solver component: <b>${r.m}</b> unknown cells, <b>${r.constraints.length}</b> constraint equations.`);
          if (subsets < (1 << r.m)) {
            calcSteps.push(`[2] Enumerated up to <b>${subsets.toLocaleString()}</b> mine placements (component too large: capped at 2²⁰).`);
          } else {
            calcSteps.push(`[2] Enumerated <b>${subsets.toLocaleString()}</b> mine placements (2<sup>${r.m}</sup>).`);
          }
          calcSteps.push(`[3] Filtered by the <b>${r.constraints.length}</b> constraint equation${r.constraints.length === 1 ? '' : 's'} from nearby revealed numbers.`);
          if (isForced) {
            calcSteps.push(`[4] <b>${totalC.toLocaleString()}</b> valid placement${totalC === 1 ? '' : 's'} survived. <b>Your cell is mine in ${mineC === 0 ? 'zero' : 'all'} of them</b> — probability is forced.`);
          } else {
            calcSteps.push(`[4] <b>${totalC.toLocaleString()}</b> valid placement${totalC === 1 ? '' : 's'} survived the filter.`);
            calcSteps.push(`[5] Your cell is a mine in <b>${mineC.toLocaleString()}</b> of those ${totalC.toLocaleString()} placements.`);
          }
        } else {
          // Multiple components (rare with bipartite BFS)
          calcSteps.push(`[1] Cell sits at intersection of <b>${realRecords.length}</b> solver components.`);
          for (let i = 0; i < realRecords.length; i++) {
            const r = realRecords[i];
            calcSteps.push(`[${2 + i}] Component ${i + 1}: ${r.m} unknowns, ${r.constraints.length} equations, ${r.totalConfigs.toLocaleString()} configs (cell is mine in ${r.configsWithMine.toLocaleString()}).`);
          }
          calcSteps.push(`[${2 + realRecords.length}] Combined: cell-mine configs / total configs = ${mineC.toLocaleString()} / ${totalC.toLocaleString()}.`);
        }
        // Global budget step. Forced local deductions stay exact; only
        // uncertain probabilities may be scaled to fit the mine budget.
        const inN = globalRec ? (globalRec.inComponentCellCount || 0) : 0;
        const inE = globalRec ? (globalRec.inComponentExpectedMines || 0) : 0;
        const farN = globalRec ? (globalRec.farCellCount || 0) : 0;
        const sf = globalRec ? (globalRec.scaleFactor || 1) : 1;
        if (globalRec && (inN > 0 || farN > 0)) {
          if (isForced) {
            calcSteps.push(`[N] Global budget check: this is a hard local deduction, so it remains <b>${mineC === 0 ? '0%' : '100%'}</b>; global adjustment cannot weaken it.`);
          } else if (sf < 1) {
            calcSteps.push(`[N] Global budget: <b>${globalRec.remainingMines}</b> mines; uncertain components expect <b>~${inE.toFixed(1)}</b>. Scaled only uncertain probabilities by ${sf.toFixed(2)}; forced 0%/100% cells stay exact.`);
          } else {
            calcSteps.push(`[N] Global budget check: ${globalRec.remainingMines} mines total, components fit (expect ~${inE.toFixed(1)}); no scaling needed.`);
          }
        }
        calcSteps.push(`P(mine) = ${mineC.toLocaleString()} / ${totalC.toLocaleString()}${!isForced && sf < 1 ? ` × ${sf.toFixed(3)}` : ''} = <b>${pct}%</b>`);

        calc = `
          <div class="ap-calc">
            <div class="ap-calc-title">Calculation (component solver)</div>
            ${calcSteps.map(s => `<div class="ap-calc-step">${s}</div>`).join('\n')}
            <div class="ap-calc-formula">P(mine) = <b>${pct}%</b></div>
          </div>`;
      }

      const legend = `
        <div class="ap-legend">
          <span><i style="background:#ffd866;color:#ffd866"></i> subject</span>
          <span><i style="background:#5fd7d7;color:#5fd7d7"></i> co-unknown</span>
          <span><i style="background:transparent;color:#f7a05f;border-style:dashed"></i> constraint</span>
          <span><i style="background:transparent;color:#ff5555;border-style:dotted"></i> flag</span>
        </div>`;

      return `
        <div class="ap-hero">
          <span class="ap-cell">Cell ${cellLabel}</span>
          <span class="ap-pct" style="color:${pColor}">${pct}%</span>
        </div>
        <div class="ap-reason">${reason}</div>
        ${calc}
        ${legend}`;
    }

  // Build the human-readable analysis HTML for a cell. The solver
  // already produced analysisCache for this cell — we just format it.
  // Collect cell indices that need highlighting for the current subject.
  // Returns { subject, co: Set, constraint: Set, flag: Set }.
  function computeHighlightSets(subjectIdx) {
    const co = new Set();
    const constraint = new Set();
    const flag = new Set();
    const records = analysisCache.get(subjectIdx) || [];
    for (const rec of records) {
      if (rec.globalRate) continue;
      for (const f of rec.flagged) flag.add(f);
      for (const ci of rec.frontier) constraint.add(ci);
      for (const ci of rec.unknowns) {
        if (ci !== subjectIdx) co.add(ci);
      }
    }
    return { subject: subjectIdx, co, constraint, flag };
  }

  function applyHighlights(sets) {
    // Add the board-level gate class first so the CSS rules activate.
    boardEl.classList.add("analysis-active");
    for (const ci of sets.co) {
      const el = boardEl.children[ci];
      if (el) el.classList.add("hover-co");
    }
    for (const ci of sets.constraint) {
      const el = boardEl.children[ci];
      if (el) el.classList.add("hover-constraint");
    }
    for (const ci of sets.flag) {
      const el = boardEl.children[ci];
      if (el) el.classList.add("hover-flag");
    }
    const subjEl = boardEl.children[sets.subject];
    if (subjEl) subjEl.classList.add("hover-subject");
    analysisActive = true;
  }

  function showAnalysisForCell(r, c) {
    const idx = r * cols + c;
    // Only analyze unrevealed unflagged cells (the ones with a probability).
    // Revealed/flagged cells get a brief explanatory panel but no highlights.
    const canAnalyze = !revealed[r][c];

    ensureSolverFresh();

    // Update panel content. Panel is docked in the layout flow so no
    // positioning math is needed — just swap innerHTML and the browser
    // handles placement. The dock stays at a stable size whether we're
    // showing the placeholder or live math, so the layout never jumps.
    if (!analysisEl) return;
    analysisEl.innerHTML = buildAnalysis(r, c);

    // Clear any prior highlights, then apply new ones if applicable.
    if (analysisActive) {
      for (const cellEl of boardEl.children) {
        cellEl.classList.remove(
          "hover-subject", "hover-co", "hover-constraint", "hover-flag"
        );
      }
    }

    if (!canAnalyze) {
      boardEl.classList.remove("analysis-active");
      analysisActive = false;
      // Still highlight the subject briefly with the gold ring so user
      // sees which cell the panel refers to.
      const subjEl = boardEl.children[idx];
      if (subjEl) {
        boardEl.classList.add("analysis-active");
        subjEl.classList.add("hover-subject");
        analysisActive = true;
      }
      analysisSubjectIdx = idx;
      return;
    }

    const sets = computeHighlightSets(idx);
    applyHighlights(sets);
    analysisSubjectIdx = idx;
  }

  function handleHover(e) {
    const target = e.target.closest(".cell");
    if (!target) return;
    const r = +target.dataset.r;
    const c = +target.dataset.c;
    const idx = r * cols + c;

    // Redundant move inside same cell: keep panel positioned with cursor
    // (so it follows if user moves the mouse within the cell) but skip
    // the recompute.
    if (idx === analysisSubjectIdx && analysisActive) {
      // We still re-position so panel doesn't drift if user moves.
      // Position is anchored to cell, not cursor, so no work needed.
      return;
    }
    showAnalysisForCell(r, c);
  }

  function handleLeave() {
    clearAnalysis();
  }

  // ---------- Difficulty buttons ----------
  function highlightActiveDifficulty() {
    document.querySelectorAll(".btn[data-diff]").forEach(b => {
      b.classList.toggle("active", b.dataset.diff === currentDifficulty);
    });
  }
  function buildDifficultyBar() {
    const bar = document.getElementById("difficulty");
    bar.innerHTML = "";
    for (const key of Object.keys(DIFFICULTIES)) {
      const cfg = DIFFICULTIES[key];
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.dataset.diff = key;
      btn.textContent = `${key[0].toUpperCase()}${key.slice(1)} (${cfg.rows}×${cfg.cols}, ${cfg.mines})`;
      btn.addEventListener("click", () => newGame(key));
      bar.appendChild(btn);
    }
    highlightActiveDifficulty();
  }

  // ---------- Input ----------
  // Long-press detection for mobile flagging.
  let longPressTimer = null;
  let longPressTriggered = false;

  function onPointerDown(e) {
    if (gameOver) return;
    const target = e.target.closest(".cell");
    if (!target) return;
    target.classList.add("pressed");
    longPressTriggered = false;
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      longPressTriggered = true;
      const r = +target.dataset.r, c = +target.dataset.c;
      toggleFlag(r, c);
    }, 350);
  }

  function clearPressed() {
    document.querySelectorAll(".cell.pressed").forEach(el => el.classList.remove("pressed"));
  }

  // ---------- Boot ----------
  // IMPORTANT: wire up DOM refs and event listeners BEFORE calling newGame().
  // The first newGame() reaches into boardEl / mineCounterEl / timerEl / faceEl.
  boardEl       = document.getElementById("board");
  mineCounterEl = document.getElementById("mineCounter");
  timerEl       = document.getElementById("timer");
  faceEl        = document.getElementById("face");
  insightBtnEl  = document.getElementById("insightBtn");
  copyLayoutBtnEl = document.getElementById("copyLayoutBtn");
  analysisEl    = document.getElementById("analysis");
  faceEl.addEventListener("click", () => newGame());
  insightBtnEl.addEventListener("click", () => setInsight(!showInsight));
  copyLayoutBtnEl.addEventListener("click", () => {
    copyLayout().catch(err => {
      copyLayoutBtnEl.textContent = "Copy failed";
      console.error(err);
    });
  });

  // Board-level listeners (must run AFTER boardEl is assigned).
  boardEl.addEventListener("contextmenu", e => {
    e.preventDefault();
    const target = e.target.closest(".cell");
    if (!target) return;
    clearTimeout(longPressTimer);
    clearPressed();
    const r = +target.dataset.r, c = +target.dataset.c;
    toggleFlag(r, c);
  });
  boardEl.addEventListener("pointerdown", onPointerDown);
  boardEl.addEventListener("pointerup", e => {
    clearTimeout(longPressTimer);
    const target = e.target.closest(".cell");
    if (!target) { clearPressed(); return; }
    target.classList.remove("pressed");
    if (longPressTriggered) return; // flag already toggled
    const r = +target.dataset.r, c = +target.dataset.c;
    if (revealed[r][c] && adjacent[r][c] > 0) {
      chordReveal(r, c);
    } else {
      reveal(r, c);
    }
  });
  boardEl.addEventListener("pointerleave", () => {
    clearTimeout(longPressTimer);
    clearPressed();
    clearAnalysis();
  });

  // Hover analysis: pointermove updates panel + highlights; leaves clear.
  // We track the subject cell so redundant moves inside the same cell
  // don't trigger recomputation.
  boardEl.addEventListener("pointermove", handleHover);

  // Keyboard: R = reset, Esc = dismiss analysis
  document.addEventListener("keydown", e => {
    if (e.key === "r" || e.key === "R") newGame();
    else if (e.key === "Escape") clearAnalysis();
  });

  buildDifficultyBar();
  newGame();
})();
</script>
</body>
</html>
